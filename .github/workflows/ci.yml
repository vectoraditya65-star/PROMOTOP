name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: file:./ci.db
      STRIPE_SECRET_KEY: sk_test_dummy_key_for_ci_only
      STRIPE_WEBHOOK_SECRET: whsec_dummy_for_ci_only
      NEXTAUTH_SECRET: dummy-secret-for-ci-only
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci

      - name: Build
        run: npx prisma db push && npm run build
